[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "20.19.1"
  GO_VERSION = "1.23.2"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
